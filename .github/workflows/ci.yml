name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Exact native rebuild and public-source tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Prepare pinned GNU and Lua environment
        run: python3 tools/prepare_ci_environment.py --root "$RUNNER_TEMP/rdp-ci-root"

      - name: Compile and verify without game inputs
        run: |
          sudo mknod -m 666 "$RUNNER_TEMP/rdp-ci-root/dev/null" c 1 3
          sudo chroot "$RUNNER_TEMP/rdp-ci-root" /usr/bin/env LC_ALL=C.UTF-8 /usr/bin/python3 /work/repo/tools/run_ci.py

      - name: Collect validation outputs
        if: always()
        run: |
          mkdir -p build/reports
          if [ -d "$RUNNER_TEMP/rdp-ci-root/work/repo/build/reports" ]; then
            cp -R "$RUNNER_TEMP/rdp-ci-root/work/repo/build/reports/." build/reports/
          fi
          if [ -f "$RUNNER_TEMP/rdp-ci-root/work/repo/build/rdp_native_merge_v07.dll" ]; then
            cp "$RUNNER_TEMP/rdp-ci-root/work/repo/build/rdp_native_merge_v07.dll" build/
          fi

      - name: Upload native build and reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-and-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/rdp_native_merge_v07.dll
            build/reports/*.json
          if-no-files-found: warn
          retention-days: 14
